[package]
name = "kpm_rwbp"
version = "2.0.0"
edition = "2024"
authors = ["ynk"]

[lib]
name = "kpm_rwbp"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
incremental = false

[unstable]
build-std = ["core", "alloc","compiler_builtins"]

[dependencies]
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
